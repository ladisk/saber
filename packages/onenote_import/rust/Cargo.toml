[workspace]

[package]
name = "onenote_import"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
onenote_parser = { version = "2.1.0", features = ["onepkg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typed-path = "0.12.3"

[profile.release]
lto = true
opt-level = "s"
# Unwind, so a panic in the parser is caught at the FFI boundary
# instead of aborting the app.
panic = "unwind"
