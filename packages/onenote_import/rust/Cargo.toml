[workspace]

[package]
name = "onenote_import"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
onenote_parser = { version = "2.1.0", features = ["onepkg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typed-path = "0.12.3"

# Fork of onenote_parser 2.1.0 that still reads sections with a page
# missing from the file or without an active revision in the default
# context, as OneNote sometimes writes them while syncing. Drop this
# once the fix is released upstream (https://github.com/msiemens/onenote.rs).
[patch.crates-io]
onenote_parser = { git = "https://github.com/ladisk/onenote.rs", rev = "a65a336322abd1971a1ddd881b27c7c11baa96d3" }

[profile.release]
lto = true
opt-level = "s"
# Unwind, so a panic in the parser is caught at the FFI boundary
# instead of aborting the app.
panic = "unwind"
